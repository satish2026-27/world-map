<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium World Map — Interactive Globe</title>
  <meta name="description" content="The most premium interactive world map — explore countries, populations, GDP, and more.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="loading-globe">🌍</div>
    <div class="loading-title">World Map</div>
    <div class="loading-subtitle">Loading interactive globe...</div>
    <div class="loading-bar-wrap">
      <div class="loading-bar"></div>
    </div>
  </div>

  <!-- Notification -->
  <div id="notification"></div>

  <!-- Tooltip -->
  <div id="tooltip">
    <div class="tooltip-flag"></div>
    <div class="tooltip-name"></div>
    <div class="tooltip-capital"></div>
    <div class="tooltip-divider"></div>
    <div class="tooltip-stat"><span>Population</span><span class="tooltip-pop"></span></div>
    <div class="tooltip-stat"><span>GDP</span><span class="tooltip-gdp"></span></div>
    <div class="tooltip-stat"><span>Region</span><span class="tooltip-region"></span></div>
  </div>

  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <div class="logo">
          <div class="logo-icon">🌐</div>
          <span class="logo-text">WorldMap</span>
          <span class="logo-badge">Premium</span>
        </div>

        <div class="search-container">
          <span class="search-icon">🔍</span>
          <input id="search-input" type="text" placeholder="Search countries... (/)">
          <div class="search-results"></div>
        </div>
      </div>

      <div class="header-controls">
        <div class="mode-selector" title="Color mode">
          <button class="mode-btn active" data-mode="region">By Region</button>
          <button class="mode-btn" data-mode="population">Population</button>
          <button class="mode-btn" data-mode="gdp">GDP</button>
        </div>

        <button class="control-btn" id="theme-btn">
          <span class="btn-icon">☀️</span> Light
        </button>

        <button class="control-btn" id="toggle-sidebar-btn">
          ◀ Hide Panel
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <div id="main">
      <!-- Map -->
      <div id="map-container">
        <div id="globe-bg"></div>

        <!-- Mini Map -->
        <div id="mini-map-container">
          <svg id="mini-svg" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet">
            <rect width="960" height="500" fill="var(--map-bg)"/>
            <!-- Mini paths will be cloned by JS -->
            <g id="mini-map-group"></g>
            <rect class="mini-viewport" x="0" y="0" width="960" height="500"/>
          </svg>
        </div>

        <!-- Zoom Indicator -->
        <div class="zoom-indicator">100%</div>

        <!-- Main SVG Map -->
        <svg id="world-svg" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet">

  <div style="
    position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
    font-size:10px; color:var(--text-muted); z-index:5; pointer-events:none;
    font-family:'Inter',sans-serif; letter-spacing:0.3px;
  ">
    Keyboard: <kbd style="background:var(--bg-card);padding:1px 4px;border-radius:3px;font-size:10px">+/-</kbd> zoom &nbsp;
    <kbd style="background:var(--bg-card);padding:1px 4px;border-radius:3px;font-size:10px">R</kbd> reset &nbsp;
    <kbd style="background:var(--bg-card);padding:1px 4px;border-radius:3px;font-size:10px">T</kbd> theme &nbsp;
    <kbd style="background:var(--bg-card);padding:1px 4px;border-radius:3px;font-size:10px">S</kbd> sidebar &nbsp;
    <kbd style="background:var(--bg-card);padding:1px 4px;border-radius:3px;font-size:10px">/</kbd> search &nbsp;
    <kbd style="background:var(--bg-card);padding:1px 4px;border-radius:3px;font-size:10px">Esc</kbd> deselect
  </div>

  <!-- Scripts -->
  <script src="countries-data.js"></script>
  <script>
    // Apply initial country colors from data
    document.addEventListener('DOMContentLoaded', () => {
      const paths = document.querySelectorAll('#map-group .country');
      paths.forEach(p => {
        const code = p.dataset.code;
        const d = COUNTRIES_DATA[code];
        if (d) {
          const rc = REGION_COLORS[d.region];
          p.style.fill = rc ? rc.primary : '#2a3a4a';
        } else {
          p.style.fill = '#2a3a4a';
        }
      });

      // Clone paths to mini map
      const miniGroup = document.getElementById('mini-map-group');
      paths.forEach(p => {
        const clone = p.cloneNode(false);
        clone.style.pointerEvents = 'none';
        clone.style.opacity = '0.7';
        miniGroup.appendChild(clone);
      });
    });
  </script>
  <script src="world-map.js"></script>
